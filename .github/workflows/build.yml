name: Build and release

# Runs when a version tag is pushed, or by hand.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      private_ref:
        description: Branch of mssl_focus_private to build with
        default: master

permissions:
  contents: write   # needed to create and update releases

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux
            artifact: dist/mssl_focus
          - os: windows-latest
            label: windows
            artifact: dist/mssl_focus.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - name: Install tkinter (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y python3-tk

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[build]

      - name: Prepare build files (icon, version info, _version.txt)
        run: python build_prepare.py "${{ github.ref_name }}"

      # Only the top-level files and src/ of the private repository are fetched.
      - name: Fetch the private modules
        uses: actions/checkout@v5
        with:
          repository: jamesmckevitt/mssl_focus_private
          ref: ${{ inputs.private_ref || 'master' }}
          ssh-key: ${{ secrets.PRIVATE_REPO_KEY }}
          path: private
          sparse-checkout: src
          filter: blob:none
          persist-credentials: false

      - name: Compile the private modules
        run: python build_private.py private

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: >
          pyinstaller
          --onefile
          --name mssl_focus
          --hidden-import tkinter
          --hidden-import tkinter.ttk
          --hidden-import src._private_deps
          --collect-all rawpy
          --collect-all cv2
          --add-data "_version.txt:."
          --add-data "app.ico:."
          --add-data "app.png:."
          --icon app.png
          mssl_focus.py

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: >
          pyinstaller
          --onefile
          --windowed
          --name mssl_focus
          --hidden-import tkinter
          --hidden-import tkinter.ttk
          --hidden-import src._private_deps
          --collect-all rawpy
          --collect-all cv2
          --add-data "_version.txt:."
          --add-data "app.ico;."
          --add-data "app.png;."
          --icon app.ico
          --manifest windows.manifest
          --version-file file_version_info.txt
          mssl_focus.py

      # A tag push creates or updates the release and attaches the program and pyproject.toml.
      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ matrix.artifact }}
            pyproject.toml

      # A run started by hand keeps the program as a workflow artifact, for testing.
      - name: Upload artifact (manual dispatch only)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v6
        with:
          name: mssl_focus_${{ matrix.label }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
